version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore: "
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-actions:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/1password"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore: "
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      all-python:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/1password"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore: "
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    # A new Python minor release ships before compiled dependencies such as
    # pydantic-core publish wheels for it, so the image build fails. Move to a
    # new minor version by hand once its wheels exist.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    groups:
      all-images:
        patterns:
          - "*"
