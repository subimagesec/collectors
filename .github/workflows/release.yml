name: Release 1Password collector

on:
  push:
    tags: ["1password/v*"]

permissions:
  contents: read

concurrency:
  group: onepassword-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a protected release tag on main
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          test "$RELEASE_REF_PROTECTED" = "true"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Verify the release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open("1password/pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit("Container releases require a stable major.minor.patch version.")
          if os.environ["GITHUB_REF_NAME"] != f"1password/v{version}":
              raise SystemExit("The release tag must match the version in pyproject.toml.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml

  container:
    needs: validate
    uses: ./.github/workflows/container.yml

  publish:
    needs: [validate, checks, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./1password
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/subimagesec/collectors/1password:${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
