name: 1Password deployment examples

on:
  pull_request:
    paths:
      - "1password/examples/**"
      - ".github/workflows/deployment-examples.yml"
  push:
    branches: [main]
    paths:
      - "1password/examples/**"
      - ".github/workflows/deployment-examples.yml"

permissions:
  contents: read

concurrency:
  group: onepassword-deployments-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: Terraform ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [cloud-run, ecs]
    defaults:
      run:
        working-directory: 1password/examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
