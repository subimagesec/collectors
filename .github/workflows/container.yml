name: 1Password container

on:
  pull_request:
    paths:
      - "1password/**"
      - ".github/workflows/container.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "1password/**"
      - ".github/workflows/container.yml"
      - ".github/workflows/release.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: onepassword-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./1password
          load: true
          push: false
          tags: onepassword-collector:ci
      - name: Smoke test the nonroot container
        run: |
          test "$(docker image inspect onepassword-collector:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m onepassword-collector:ci --help
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --entrypoint op onepassword-collector:ci --version
          docker run --rm --network none --read-only --entrypoint python onepassword-collector:ci -c 'import boto3; from google.cloud import storage'
      - name: Check CLI runtime flags and SDK native dependencies
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env HOME=/tmp --env OP_CONFIG_DIR=/tmp/op \
            --entrypoint python onepassword-collector:ci -c '
          from pathlib import Path
          from onepassword.core import UniffiCore
          from onepassword_collector.onepassword import OpClient
          assert "Copyright (c) 2024 1Password" in Path("/usr/share/licenses/onepassword-sdk/LICENSE").read_text()
          UniffiCore()
          assert OpClient("op").read(["account", "list"], "offline CLI compatibility") == []
          '
      - name: Reject missing collector configuration
        run: |
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m onepassword-collector:ci
          collector_status=$?
          set -e
          test "$collector_status" -eq 2
