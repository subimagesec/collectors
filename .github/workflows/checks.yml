name: 1Password checks

on:
  pull_request:
    paths:
      - "1password/**"
      - "Makefile"
      - ".github/workflows/checks.yml"
  push:
    branches: [main]
    paths:
      - "1password/**"
      - "Makefile"
      - ".github/workflows/checks.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: onepassword-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: 1password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "1password/uv.lock"
      - run: uv sync --frozen --all-extras
      - run: make -C .. test
